<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rohan's Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #171717;
    }

    header {
      padding: 24px 40px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 24px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 12px;
    }

    p {
      color: #666;
      font-size: 18px;
    }

    .card {
      margin-top: 40px;
      padding: 30px;
      background: white;
      border-radius: 14px;
      border: 1px solid #e5e5e5;
    }

    .ocean-ad {
      width: 100%;
      min-height: 300px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 10px;
    }

    .ocean-ad::before {
      content: "Ocean Ad";
      color: #999;
    }
  </style>

  <!-- Ocean Ads CDN -->
  <script src="https://prime-api.oceanadnetwork.com/cdn/p/92040231-8f0e-4308-8e69-ec8e9db0023a/init.js"></script>

  <!-- Fix current SDK config -->
  <script>
    if (window.__OCEAN_CONFIG__) {
      const config = window.__OCEAN_CONFIG__;

      config.websites = {
        "iamrohandhiman.github.io":
          config.websites["https://iamrohandhiman.github.io"]
          || config.websites["https://iamrohandhiman.github.io/"]
      };
    }

    // Initialize after fixing the configuration
    window.addEventListener("load", function () {
      if (window.OceanAds) {
        window.OceanAds.forceInit();
      }
    });
  </script>
</head>

<body>
  <header>
    <strong>Rohan</strong>
  </header>

  <main>
    <h1>Welcome to Rohan's Website 👋</h1>

    <p>
      This is a test website running on GitHub Pages with Ocean Ads.
    </p>

    <div class="card">
      <h2>Advertisement</h2>

      <div class="ocean-ad"></div>
    </div>
  </main>
</body>
</html>
