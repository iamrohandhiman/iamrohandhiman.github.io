<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rohan's Test Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      text-align: center;
      padding: 40px;
    }

    p { color: #666; }

      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      border-radius: 8px;
      background: #e6f7e6;
      color: #187a18;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GitHub Pages is working 🚀</h1>
    <p>This is a temporary test page.</p>
    <div class="status">Deployment successful</div>
  </div>

</html>
